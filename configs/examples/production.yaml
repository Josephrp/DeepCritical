# @package _global_

defaults:
  - config
  - rag: default
  - rag/vector_store: neo4j
  - rag/llm: vllm_local
  - rag/embeddings: vllm_local
  - _self_

# Enable the RAG flow (legacy flag used by `DeepResearch/app.py` router)
flows:
  rag:
    enabled: true

# Expected environment variables (see docs):
# - NEO4J_URI, NEO4J_USERNAME, NEO4J_PASSWORD
# - (optional) VLLM server endpoints if not localhost defaults
